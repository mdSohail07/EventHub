# ============================================================
# EventHub Frontend — CI/CD Pipeline
# Trigger: Every push to main branch (frontend folder changes)
# Steps: Install → Build Check → Vercel auto-deploys itself
# ============================================================

name: 🎨 Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'event-hub-frontend/**'  # Sirf frontend change hone pe chalega
  pull_request:
    branches: [main]
    paths:
      - 'event-hub-frontend/**'

jobs:
  # ─── JOB 1: CI — Build & Verify ────────────────────────────
  build:
    name: ✅ Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: event-hub-frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: event-hub-frontend
        run: npm install

      - name: 🏗️ Build Next.js App
        working-directory: event-hub-frontend
        run: npm run build
        env:
          # Build time mein dummy API URL use karo
          # (real API Vercel env variables se aata hai)
          NEXT_PUBLIC_API_URL: https://eventhub-backend-uzrz.onrender.com

      - name: ✅ Build Successful!
        run: echo "🎉 Frontend build passed — Vercel will auto-deploy!"

  # ─── NOTE: Frontend Deploy ────────────────────────────────
  # Vercel apne aap deploy karta hai GitHub se connected hone ke baad.
  # Hume separately deploy nahi karna — Vercel ka GitHub integration
  # automatically production deploy karta hai jab main pe push hota hai.
  # Is workflow ka kaam hai SIRF build break ko pakadna BEFORE deploy.
